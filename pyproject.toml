[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "integrx"
version = "0.1.0"
description = "B2B integration troubleshooting platform: SFTP/AS2/REST intake, canonical model, tracing, classification, replay."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hrushika Pendharkar" }]
dependencies = [
  "payload-doctor>=0.1.0",       # sibling repo; install it first with: pip install -e ../payload-doctor
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "boto3>=1.34",
  "paramiko>=3.4",
  "pyas2lib>=1.4.3",
  # oscrypto's PyPI release cannot detect OpenSSL 3.x version strings; pyas2lib needs this fixed commit.
  "oscrypto @ https://github.com/wbond/oscrypto/archive/1547f535001ba568b239b8797465536759c742a3.zip",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "moto[s3]>=5"]

[project.scripts]
integrx-watcher = "integrx.sftp_watcher:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/integrx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
